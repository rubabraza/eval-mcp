[project]
name = "eval-mcp"
version = "0.1.0"
description = "A small eval harness any MCP client can drive: keep test cases, run a prompt against them, grade the answers, and compare two prompt versions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.8.0,<2",
    "pydantic>=2.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
